name: Fresh Jekyll Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler-cache: true

      - name: Download all JS assets flatly
        run: |
          mkdir -p _assets/javascripts
          curl -sSL https://code.jquery.com/jquery-3.7.1.min.js -o _assets/javascripts/jquery.js
          curl -sSL https://cdn.jsdelivr.net/npm/zooming@2.1.1/build/zooming.min.js -o _assets/javascripts/zooming.min.js
          curl -sSL https://cdn.jsdelivr.net/npm/retinajs@2.1.5/dist/retina.min.js -o _assets/javascripts/retina.js
          curl -sSL https://cdn.jsdelivr.net/npm/svgxuse@1.2.6/svgxuse.js -o _assets/javascripts/svgxuse.js

      - name: Install Ruby Dependencies
        run: |
          gem install bundler -v '< 2.5'
          bundle install

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.pages_info.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4